name: Feed yayımla

# Üretici zamanlayıcıya bağlanır ve çıktısı GitHub Pages'e yayımlanır.
# Uygulama kodu bundan habersizdir: `--dart-define=FEED_URL=...` verilmediği
# sürece paketlenmiş içerikle eksiksiz çalışır.
#
# Kurulum ve kararların gerekçesi: docs/FEED_HOSTING_RUNBOOK.md
#
# Bu dosya **iki depoda** çalışır ve ikisi aynı koddur:
#   cakar1125/tecnow       → feed.tecnow.app          (birincil)
#   cakar1125/tecnow-ayna  → github.io/tecnow-ayna    (yedek)
#
# Farkı depo değişkenleri kuruyor, dosya değil: aynada `FEED_DOMAIN`
# **tanımsızdır**, dolayısıyla CNAME yazılmaz. Aynaya `FEED_DOMAIN`
# eklenirse iki depo aynı alan adına dağıtım yapar ve birincil kırılır.

on:
  # Saatte bir. Önceki tempo altı saatteydi ve gerekçesi "istemci zaten 12
  # saatte bir bakıyor"du; 2026-08-06'da ölçüm o gerekçeyi geçersiz kıldı.
  # Kendi barındırmamızda koşullu istek çalışıyor (`If-None-Match` → `304`,
  # **0 bayt**), yani sık bakmanın maliyeti yok. Darboğaz istemci değil
  # üretim tarafıydı: kullanıcı ne kadar sık bakarsa baksın, altı saatte bir
  # üretilen bir dosyadan daha tazesini göremiyordu.
  #
  # Neden 17. dakika: GitHub zamanlanmış işleri saat başlarında yoğunlukta
  # geciktiriyor. Ofsetli dakika bu kuyruğun dışında kalıyor.
  #
  # Daha sık denendi ve **reddedildi**: 15 dakikada bir, 18 kaynağa günde
  # ~1.700 istek demek — günde birkaç kez değişen içerik için üçüncü
  # tarafların sunucularına gereksiz yük, ve koşu ~6 dakika sürdüğü için
  # koşular birbirine binerdi.
  #
  # UYARI: GitHub, 60 gün hiç hareket görmeyen depolarda zamanlanmış
  # iş akışlarını **otomatik kapatır**. Runbook'ta yazılı.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda iki yayım olmaz: ikisi de aynı dosyayı üretip birbirinin
# üzerine yazardı ve hangisinin kazandığı belirsiz olurdu.
concurrency:
  group: feed-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: mobile
    # Hazır adımlar **tam commit SHA'sına** sabitlenir, etikete değil.
    #
    # Etiket taşınabilir bir işaretçidir: `@v4`, deponun sahibi (ya da onu ele
    # geçiren biri) tarafından başka bir commit'e çevrilebilir. Bu adımlar
    # bizim iş akışımızda, bizim secret'larımıza erişebilecek bağlamda
    # çalışıyor — `ANTHROPIC_API_KEY` eklendiği gün bu bir tedarik zinciri
    # riski olur. SHA taşınamaz.
    #
    # Yükseltirken: yeni sürümün SHA'sını `gh api repos/<depo>/commits/<etiket>`
    # ile alın ve yorumdaki sürüm etiketini de güncelleyin.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Sabitlenmiş: üretici çıktısı belirlenimci olmalı ve SDK
          # yükseltmesi kimsenin fark etmediği bir gün gelmemeli.
          # Yükseltirken runbook'taki adımı izleyin.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # Kapı, yenisini eskisiyle karşılaştırabilmek için yayımdakine ihtiyaç
      # duyuyor. İlk koşuda yok; indirilemezse karşılaştırma yapılmaz ama
      # yayım engellenmez.
      - name: Yayımdaki feed'i indir
        env:
          FEED_URL: ${{ vars.FEED_URL }}
        run: |
          mkdir -p build/publish
          if [ -z "$FEED_URL" ]; then
            echo "FEED_URL deposu değişkeni tanımlı değil; ilk yayım varsayılıyor."
            exit 0
          fi
          curl -fsSL --max-time 60 "$FEED_URL" -o build/previous.json \
            || echo "Yayımdaki feed indirilemedi; karşılaştırma yapılmayacak."

      - name: Feed üret
        env:
          # Actions'ın kendi token'ı GitHub API kotasını yükseltir; ek bir
          # sır gerekmiyor.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # İkisi de isteğe bağlı. Hiçbiri yoksa özetler kaynağın kendi
          # metniyle kalır ve feed yine eksiksiz üretilir.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          # `--previous`: yayımdaki kopya bir üstteki adımda zaten indirildi.
          # Kaynak metni değişmemiş kayıtların özeti **taşınır**, model
          # yeniden çağrılmaz. Dosya yoksa (ilk yayım) taşıma sessizce kapalı
          # kalır ve üretim eksiksiz sürer.
          #
          # Çıktı **dosyaya da** yazılıyor: koşu logu jetonsuz okunamıyor
          # (API 403) ama annotation'lar public depoda okunabiliyor. Aşağıdaki
          # blok hata hâlinde son satırları annotation'a taşıyor.
          dart run tool/feed/generate.dart \
            --out build/publish/feed.json \
            --previous build/previous.json 2>&1 | tee build/generate.log
          # `tee` her zaman 0 döner; asıl kod boru hattının **ilk** halkasında.
          status=${PIPESTATUS[0]}
          set -e
          # 0 tam başarı · 2 kısmi (bazı kaynaklar okunamadı ama dosya
          # yazıldı) · 1 çalışma hatası.
          #
          # 2'yi sessizce başarı saymak, kaynakların teker teker ölmesini
          # görünmez kılardı; uyarı olarak yüzeye çıkarılıyor.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            # Sebep görünür olmalı. Bu blok olmadan iki koşu (#96, #99,
            # 12 Ağustos 2026) yalnız "exit code 255" bırakıp öldü ve kusur
            # kararsız olduğu için yerelde hiç yeniden üretilemedi.
            detail=$(tail -40 build/generate.log || true)
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/}"
            detail="${detail//$'\n'/'%0A'}"
            echo "::error title=Feed uretimi basarisiz (kod $status)::${detail}"
            exit "$status"
          fi
          if [ "$status" -eq 2 ]; then
            echo "::warning::Bazı kaynaklar okunamadı; ayrıntı yukarıdaki çıktıda."
          fi

      # Üretici dosya yazdı diye yayımlanmaz. Bkz. tool/feed/publish_guard.dart
      - name: Yayım koruması
        id: guard
        run: |
          set +e
          dart run tool/feed/publish_guard.dart \
            --next build/publish/feed.json \
            --previous build/previous.json
          status=$?
          set -e
          case "$status" in
            0) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "publish=false" >> "$GITHUB_OUTPUT"
               echo "::notice::Kayıtlar değişmemiş; yayım atlandı." ;;
            *) exit "$status" ;;
          esac

      - name: Yayımlanacak dizini hazırla
        if: steps.guard.outputs.publish == 'true'
        env:
          # Alan adı depo değişkeninden okunur, dosyaya gömülmez: alan adı
          # değişirse iş akışına dokunmak gerekmesin.
          FEED_DOMAIN: ${{ vars.FEED_DOMAIN }}
        run: |
          cp ../docs/feed_site_index.html build/publish/index.html
          # Özel alan adı Pages ayarında tutulur; artefakttaki CNAME ikinci
          # kilittir, ayarın yeniden dağıtımlarda kaybolmasına karşı.
          #
          # Değişken tanımsızken CNAME **yazılmaz**: ilk koşu github.io
          # üzerinde yapılıyor ve boş bir CNAME dosyası dağıtımı bozardı.
          if [ -n "$FEED_DOMAIN" ]; then
            printf '%s\n' "$FEED_DOMAIN" > build/publish/CNAME
            echo "::notice::CNAME yazıldı: $FEED_DOMAIN"
          else
            echo "::notice::FEED_DOMAIN tanımsız; github.io adresi kullanılıyor."
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.guard.outputs.publish == 'true'
        with:
          path: mobile/build/publish

      - id: deploy
        if: steps.guard.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
# Actions kaydı 2026-08-06'da web arayüzünden tetiklendi.
#
# Not: yeni depoya ilk push'tan sonra GitHub bu iş akışını Actions listesine
# hiç almadı ("This workflow does not exist"), dosya geçerli olmasına rağmen.
# Web arayüzünden atılan bir commit kaydı tetikledi. Aynı belirti tekrarlarsa
# çözüm budur.
