<style>
        /* Hyper-technical background pattern */
        body {
            background-color: #0c0e12;
            background-image: linear-gradient(rgba(45, 49, 57, 0.3) 1px, transparent 1px),
            linear-gradient(90deg, rgba(45, 49, 57, 0.3) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        /* Custom Checkbox Styling */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: #333539;
            margin: 0;
            display: grid;
            place-content: center;
        }
        input[type="checkbox"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #002022;
            background-color: #002022;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }
    </style>
<style>

      min-height: max(884px, 100dvh);

<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface font-body-sm font-sans selection:bg-primary-container selection:text-on-primary-container relative overflow-x-hidden">
<!-- Decorative ambient glow -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container/5 rounded-full blur-[120px] pointer-events-none z-0"></div>
<main class="w-full max-w-md relative z-10 animate-fade-in-up">
<!-- Brand Header -->
<div class="flex items-center justify-center gap-xs mb-lg">
<span class="material-symbols-outlined text-primary-fixed text-headline-lg font-headline-lg" style="font-variation-settings: 'FILL' 1;">data_object</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary-fixed tracking-tight">TeknoAkış</h1>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-lg md:p-xl shadow-[0_4px_24px_rgba(0,0,0,0.5)] backdrop-blur-md relative overflow-hidden group">
<!-- Subtle top border highlight on hover -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-lg text-center">Hesap Oluştur</h2>
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Ad Soyad Field -->
<div>
<label class="font-mono-label text-mono-label text-on-surface-variant mb-xs block uppercase" for="fullName">Ad Soyad</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant text-[18px]">person</span>
<input class="w-full bg-surface-variant border border-outline-variant rounded-lg py-sm pl-[36px] pr-sm font-mono-code text-mono-code text-on-surface placeholder-on-surface-variant/50 focus:border-primary-fixed focus:outline-none focus:ring-1 focus:ring-primary-fixed/50 transition-all shadow-inner" id="fullName" name="fullName" placeholder="isim soyisim" required="" type="text"/>
</div>
</div>
<!-- E-posta Field -->
<div>
<label class="font-mono-label text-mono-label text-on-surface-variant mb-xs block uppercase" for="email">E-posta</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant text-[18px]">alternate_email</span>
<input class="w-full bg-surface-variant border border-outline-variant rounded-lg py-sm pl-[36px] pr-sm font-mono-code text-mono-code text-on-surface placeholder-on-surface-variant/50 focus:border-primary-fixed focus:outline-none focus:ring-1 focus:ring-primary-fixed/50 transition-all shadow-inner" id="email" name="email" placeholder="adres@domain.com" required="" type="email"/>
</div>
</div>
<!-- Şifre Field -->
<div>
<label class="font-mono-label text-mono-label text-on-surface-variant mb-xs block uppercase" for="password">Şifre</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant text-[18px]">key</span>
<input class="w-full bg-surface-variant border border-outline-variant rounded-lg py-sm pl-[36px] pr-sm font-mono-code text-mono-code text-on-surface placeholder-on-surface-variant/50 focus:border-primary-fixed focus:outline-none focus:ring-1 focus:ring-primary-fixed/50 transition-all shadow-inner" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Şifre Tekrar Field -->
<div>
<label class="font-mono-label text-mono-label text-on-surface-variant mb-xs block uppercase" for="passwordConfirm">Şifre Tekrar</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant text-[18px]">lock_reset</span>
<input class="w-full bg-surface-variant border border-outline-variant rounded-lg py-sm pl-[36px] pr-sm font-mono-code text-mono-code text-on-surface placeholder-on-surface-variant/50 focus:border-primary-fixed focus:outline-none focus:ring-1 focus:ring-primary-fixed/50 transition-all shadow-inner" id="passwordConfirm" name="passwordConfirm" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-sm mt-xs">
<input class="w-4 h-4 mt-0.5 border-outline-variant rounded cursor-pointer checked:bg-primary-container checked:border-primary-container focus:ring-primary-container focus:ring-offset-surface-container-low focus:ring-offset-2" id="terms" name="terms" required="" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="terms">
<a class="text-primary-fixed hover:underline underline-offset-2 decoration-primary-fixed/50" href="#">Hizmet Şartları</a>'nı ve <a class="text-primary-fixed hover:underline underline-offset-2 decoration-primary-fixed/50" href="#">Gizlilik Politikası</a>'nı okudum ve kabul ediyorum.
                    </label>
</div>
<!-- Primary Button -->
<button class="w-full bg-primary-container text-on-primary-fixed font-headline-md text-headline-md font-bold rounded-lg py-sm px-md flex justify-center items-center gap-xs hover:bg-primary-fixed transition-colors shadow-[0_0_15px_rgba(0,240,255,0.15)] hover:shadow-[0_0_25px_rgba(0,240,255,0.3)] mt-sm group" type="submit">
                    Kayıt Ol

</button>
</form>
<!-- Divider -->
<div class="flex items-center my-lg">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="px-sm font-mono-label text-mono-label text-outline uppercase tracking-wider">Veya şununla devam et</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-xs bg-surface-container-highest border border-outline-variant hover:border-primary-fixed hover:bg-surface-bright rounded-lg py-sm px-sm transition-all text-on-surface font-body-sm text-body-sm shadow-sm group" type="button">

                    GitHub
                </button>
<button class="flex items-center justify-center gap-xs bg-surface-container-highest border border-outline-variant hover:border-primary-fixed hover:bg-surface-bright rounded-lg py-sm px-sm transition-all text-on-surface font-body-sm text-body-sm shadow-sm group" type="button">
<span class="material-symbols-outlined text-[20px] opacity-80 group-hover:opacity-100 transition-opacity">account_circle</span>
                    Google
                </button>
</div>
<p class="text-center font-mono-code text-mono-code text-on-surface-variant mt-lg">
                Zaten hesabınız var mı? <a class="text-primary-fixed hover:underline decoration-primary-fixed/50" href="#">Giriş Yap</a>
</p>
</div>
</main>
<script>
        // Simple script to add a subtle fade-in animation to the main container
        document.addEventListener('DOMContentLoaded', () => {
            const mainEl = document.querySelector('main');
            mainEl.style.opacity = '0';
            mainEl.style.transform = 'translateY(10px)';
            mainEl.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            
            setTimeout(() => {
                mainEl.style.opacity = '1';
                mainEl.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
