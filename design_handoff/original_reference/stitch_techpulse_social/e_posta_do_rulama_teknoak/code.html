            </p>
<form class="w-full flex flex-col items-center">
<!-- PIN Inputs -->
<div class="flex justify-between w-full gap-sm md:gap-md mb-xl" id="pin-container">

<input aria-label="Digit 2" class="pin-input w-12 h-14 md:w-14 md:h-16 rounded bg-surface-container-highest border border-outline-variant text-center font-mono-code text-mono-code text-on-surface glow-effect transition-all focus:outline-none focus:ring-0" maxlength="1" type="number"/>
<input aria-label="Digit 3" class="pin-input w-12 h-14 md:w-14 md:h-16 rounded bg-surface-container-highest border border-outline-variant text-center font-mono-code text-mono-code text-on-surface glow-effect transition-all focus:outline-none focus:ring-0" maxlength="1" type="number"/>
<input aria-label="Digit 4" class="pin-input w-12 h-14 md:w-14 md:h-16 rounded bg-surface-container-highest border border-outline-variant text-center font-mono-code text-mono-code text-on-surface glow-effect transition-all focus:outline-none focus:ring-0" maxlength="1" type="number"/>
<input aria-label="Digit 5" class="pin-input w-12 h-14 md:w-14 md:h-16 rounded bg-surface-container-highest border border-outline-variant text-center font-mono-code text-mono-code text-on-surface glow-effect transition-all focus:outline-none focus:ring-0" maxlength="1" type="number"/>
<input aria-label="Digit 6" class="pin-input w-12 h-14 md:w-14 md:h-16 rounded bg-surface-container-highest border border-outline-variant text-center font-mono-code text-mono-code text-on-surface glow-effect transition-all focus:outline-none focus:ring-0" maxlength="1" type="number"/>

                    Doğrula
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>

<script>
        // PIN input logic
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.pin-input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Limit to 1 digit
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    // Move to next input if filled
                    if (e.target.value !== '' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // Move to previous input on backspace
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
            
            // Focus first input on load
            if (inputs.length > 0) {
                inputs[0].focus();
            }
        });
    </script>
