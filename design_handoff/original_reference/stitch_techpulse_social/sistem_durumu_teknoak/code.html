        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.1) 50%,
                rgba(0, 0, 0, 0.1)

            pointer-events: none;
        }

            box-shadow: 0 0 15px rgba(0, 219, 233, 0.1);
            transition: box-shadow 0.3s ease;
        }
        
        .glow-border:hover {
            box-shadow: 0 0 25px rgba(0, 219, 233, 0.2);
            border-color: theme('colors.surface-tint');

<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-background">

<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-container-high/20 via-background to-background z-0 pointer-events-none"></div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-2xl px-margin-mobile md:px-margin-desktop flex flex-col items-center text-center">

<div class="w-full max-w-sm mb-lg relative">

</div>

<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="font-mono-code text-mono-code text-on-surface-variant">ERR_503</span>
</div>
<div class="absolute -left-2 bottom-1/4 bg-surface border border-outline-variant rounded px-sm py-base flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px] text-surface-tint" style="font-variation-settings: 'FILL' 1;">build</span>
<span class="font-mono-code text-mono-code text-on-surface-variant">MAINTENANCE_MODE</span>
</div>
</div>
<!-- Typography Context -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">
            Sistem Bakımda
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto mb-xl">
            Size daha iyi bir deneyim sunmak için çalışıyoruz. Lütfen biraz sonra tekrar deneyin.
        </p>
<!-- Technical Metadata Block -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-md mb-xl w-full max-w-md text-left text-on-surface-variant">
<div class="flex justify-between items-center border-b border-outline-variant pb-sm mb-sm">
<span class="font-mono-label text-mono-label uppercase tracking-widest text-outline">Diagnostic Data</span>
<span class="material-symbols-outlined text-outline">terminal</span>
</div>
<div class="space-y-xs font-mono-code text-mono-code">

<span class="text-outline">Status Code:</span>

</div>
<div class="flex justify-between">
<span class="text-outline">Est. Recovery:</span>
<span class="text-tertiary-fixed-dim">~15 Minutes</span>
</div>
<div class="flex justify-between">

<span class="text-primary-fixed">eu-central-1a</span>
</div>
</div>
</div>

<span class="material-symbols-outlined">refresh</span>
