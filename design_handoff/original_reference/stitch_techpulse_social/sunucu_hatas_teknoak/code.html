<style>
        body {
            background-color: #0A0C10; /* Custom dark per prompt, though we should use tokens where possible. Overriding for specific request. */
        }
        
        .pulse-border {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-border {
            0%, 100% {
                border-color: rgba(0, 240, 255, 0.5); /* Electric Cyan / primary-container */
                box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            }
            50% {
                border-color: rgba(0, 240, 255, 0.1);
                box-shadow: 0 0 5px rgba(0, 240, 255, 0.05);
            }
        }
        
        .glitch-text {
            animation: glitch 3s infinite;
        }
        
        @keyframes glitch {
            0% { opacity: 1; transform: translate(0); }
            5% { opacity: 0.8; transform: translate(-2px, 1px); color: #ffb4ab; }
            10% { opacity: 1; transform: translate(0); color: inherit; }
            15% { opacity: 0.9; transform: translate(1px, -1px); color: #00f0ff; }
            20% { opacity: 1; transform: translate(0); color: inherit; }
            100% { opacity: 1; transform: translate(0); }
        }
    </style>

<body class="text-on-surface antialiased min-h-screen flex flex-col items-center">

</button>
</header>

</div>

<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">

                    </p>
</div>

<span class="material-symbols-outlined text-[14px]">content_copy</span>
