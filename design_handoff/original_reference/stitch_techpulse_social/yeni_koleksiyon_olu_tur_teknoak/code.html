<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center font-body-lg">
<!-- Mobile Container Wrapper to simulate 390x844 view -->
<div class="w-full max-w-[390px] h-full min-h-[844px] bg-surface-container-lowest relative overflow-hidden flex flex-col border border-outline-variant/30 rounded-xl md:shadow-2xl">
<!-- Header -->
<header class="w-full flex items-center justify-between px-margin-mobile py-md bg-surface/60 backdrop-blur-xl border-b border-outline-variant z-10 sticky top-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Yeni Koleksiyon</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Form Content -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-lg pb-32 flex flex-col gap-lg">
<!-- Collection Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-mono-label text-mono-label text-on-surface-variant ml-sm" for="collectionName">Koleksiyon Adı</label>
<div class="relative">
<input class="w-full bg-surface-container border border-outline-variant rounded-xl py-md px-md text-on-surface font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-on-surface-variant/50" id="collectionName" placeholder="Örn: Favori AI Araçları" type="text"/>
<div class="absolute right-md top-1/2 -translate-y-1/2 font-mono-label text-mono-label text-on-surface-variant/50">
<span id="nameCount">0</span>/50
                    </div>
</div>
</div>
<!-- Description Input -->
<div class="flex flex-col gap-xs">
<label class="font-mono-label text-mono-label text-on-surface-variant ml-sm" for="collectionDesc">Açıklama (İsteğe Bağlı)</label>
<div class="relative">
<textarea class="w-full bg-surface-container border border-outline-variant rounded-xl py-md px-md text-on-surface font-body-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-on-surface-variant/50 resize-none" id="collectionDesc" placeholder="Bu koleksiyonda neler var?" rows="3"></textarea>
<div class="absolute right-md bottom-md font-mono-label text-mono-label text-on-surface-variant/50">
<span id="descCount">0</span>/200
                    </div>
</div>
</div>
<!-- Visual Selection (Icon / Color) -->
<div class="flex flex-col gap-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant ml-sm">Görünüm</label>
<div class="flex flex-col gap-md bg-surface-container rounded-xl p-md border border-outline-variant">
<!-- Color Picker -->
<div class="flex flex-col gap-sm">
<span class="font-body-sm text-body-sm text-on-surface-variant">Renk Seçimi</span>
<div class="flex gap-sm overflow-x-auto hide-scrollbar pb-xs">
<button class="w-10 h-10 rounded-full bg-primary flex items-center justify-center border-2 border-surface-container shrink-0 outline outline-2 outline-primary outline-offset-2">
<span class="material-symbols-outlined text-on-primary text-[18px]">check</span>
</button>
<button class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center border-2 border-surface-container shrink-0 hover:scale-110 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-[#ff7b72] flex items-center justify-center border-2 border-surface-container shrink-0 hover:scale-110 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-[#f2cc60] flex items-center justify-center border-2 border-surface-container shrink-0 hover:scale-110 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-[#79c0ff] flex items-center justify-center border-2 border-surface-container shrink-0 hover:scale-110 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-[#d2a8ff] flex items-center justify-center border-2 border-surface-container shrink-0 hover:scale-110 transition-transform"></button>
</div>
</div>
<div class="h-px w-full bg-outline-variant/30"></div>
<!-- Icon Picker -->
<div class="flex flex-col gap-sm">
<span class="font-body-sm text-body-sm text-on-surface-variant">İkon (İsteğe Bağlı)</span>
<div class="flex gap-sm overflow-x-auto hide-scrollbar pb-xs">
<button class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center border border-outline-variant shrink-0 text-on-surface hover:text-primary hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">folder</span>
</button>
<button class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center border border-outline-variant shrink-0 text-on-surface hover:text-primary hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">code</span>
</button>
<button class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center border border-outline-variant shrink-0 text-on-surface hover:text-primary hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">terminal</span>
</button>
<button class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center border border-outline-variant shrink-0 text-on-surface hover:text-primary hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">data_object</span>
</button>
<button class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center border border-outline-variant shrink-0 text-on-surface hover:text-primary hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">memory</span>
</button>
<button class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center border border-outline-variant shrink-0 text-on-surface hover:text-primary hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
</div>
</div>
</div>
<!-- Privacy Settings -->
<div class="flex flex-col gap-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant ml-sm">Gizlilik</label>
<div class="flex flex-col bg-surface-container rounded-xl border border-outline-variant overflow-hidden">
<!-- Option 1: Only me -->
<label class="flex items-center gap-md p-md border-b border-outline-variant/50 cursor-pointer hover:bg-surface-variant/30 transition-colors">
<div class="w-6 h-6 rounded-full border border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-transparent"></div>
</div>
<input class="hidden" name="privacy" type="radio" value="private"/>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">lock</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Yalnızca ben</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Bu koleksiyonu sadece siz görebilirsiniz.</span>
</div>
</label>
<!-- Option 2: Link sharing -->
<label class="flex items-center gap-md p-md border-b border-outline-variant/50 cursor-pointer hover:bg-surface-variant/30 transition-colors">
<div class="w-6 h-6 rounded-full border border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-transparent"></div>
</div>
<input class="hidden" name="privacy" type="radio" value="unlisted"/>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">link</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Bağlantıya sahip olanlar</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Bağlantıyı paylaştığınız kişiler görebilir.</span>
</div>
</label>
<!-- Option 3: Public -->
<label class="flex items-center gap-md p-md cursor-pointer bg-primary/5 hover:bg-primary/10 transition-colors">
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>
<input checked="" class="hidden" name="privacy" type="radio" value="public"/>
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">public</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Herkese açık</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Profilinizde ve aramalarda görünür.</span>
</div>
</label>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="w-full bg-surface-container/90 backdrop-blur-xl border-t border-outline-variant p-margin-mobile flex gap-md absolute bottom-0 z-20 pb-safe">
<button class="flex-1 py-md px-md rounded-xl border border-outline-variant text-on-surface font-body-lg text-body-lg hover:bg-surface-variant transition-colors flex items-center justify-center">
                Vazgeç
            </button>
<button class="flex-1 py-md px-md rounded-xl bg-primary text-on-primary font-body-lg text-body-lg font-semibold hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-sm shadow-[0_0_15px_rgba(0,240,255,0.2)]">
                Oluştur
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</footer>
</div>
<script>
        // Simple character count logic
        const nameInput = document.getElementById('collectionName');
        const nameCount = document.getElementById('nameCount');
        const descInput = document.getElementById('collectionDesc');
        const descCount = document.getElementById('descCount');

        nameInput.addEventListener('input', () => {
            nameCount.textContent = nameInput.value.length;
        });

        descInput.addEventListener('input', () => {
            descCount.textContent = descInput.value.length;
        });

        // Simple radio button visual toggle logic for demonstration
        const privacyLabels = document.querySelectorAll('input[name="privacy"]');
        privacyLabels.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all
                document.querySelectorAll('input[name="privacy"]').forEach(r => {
                    const label = r.closest('label');
                    label.classList.remove('bg-primary/5', 'hover:bg-primary/10');
                    const indicator = label.querySelector('.w-6.h-6');
                    indicator.className = 'w-6 h-6 rounded-full border border-outline-variant flex items-center justify-center';
                    indicator.querySelector('div').className = 'w-3 h-3 rounded-full bg-transparent';
                    
                    const iconBg = label.querySelector('.w-10.h-10');
                    iconBg.className = 'w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant';
                });

                // Set active
                if(e.target.checked) {
                    const activeLabel = e.target.closest('label');
                    activeLabel.classList.add('bg-primary/5', 'hover:bg-primary/10');
                    
                    const activeIndicator = activeLabel.querySelector('.w-6.h-6');
                    activeIndicator.className = 'w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center';
                    activeIndicator.querySelector('div').className = 'w-3 h-3 rounded-full bg-primary';

                    const activeIconBg = activeLabel.querySelector('.w-10.h-10');
                    activeIconBg.className = 'w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary';
                }
            });
        });
    </script>
</body></html>
