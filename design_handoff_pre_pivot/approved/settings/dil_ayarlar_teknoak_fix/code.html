<style>
        /* Base styles to enforce mobile viewport for preview purposes */
        body {
            max-width: 390px;
            height: 844px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
        }
        
        .switch-toggle {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .switch-knob {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .switch-active .switch-toggle {
            background-color: theme('colors.primary-container');
        }
        
        .switch-active .switch-knob {
            transform: translateX(16px);
            background-color: theme('colors.on-primary-container');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-container-lowest text-on-surface flex flex-col font-body-sm overflow-hidden">
<!-- Top App Bar (Task-Focused: No global nav) -->
<header class="h-16 flex items-center px-margin-mobile border-b border-outline-variant bg-surface-container-lowest/80 backdrop-blur-md z-10 shrink-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:bg-surface-variant transition-colors -ml-2 group">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary-fixed transition-colors">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md ml-2 tracking-tight">Dil</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-lg pb-32">
<!-- Section: Uygulama Dili -->
<section class="mb-lg">
<h2 class="font-mono-label text-mono-label text-primary-fixed mb-sm uppercase">Uygulama Dili</h2>
<div class="bg-surface-container rounded-xl border border-outline-variant overflow-hidden">
<!-- Turkish Option (Selected) -->
<button class="w-full flex items-center justify-between p-md border-b border-outline-variant bg-surface-variant/30 transition-colors active:bg-surface-variant/50">
<span class="font-body-lg text-body-lg text-primary">Türkçe</span>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- English Option (Coming Soon) -->
<div class="w-full flex items-center justify-between p-md opacity-60">
<span class="font-body-lg text-body-lg text-on-surface-variant">İngilizce</span>
<span class="font-mono-label text-mono-label bg-surface-variant text-on-surface px-2 py-1 rounded-sm border border-outline-variant">Yakında</span>
</div>
</div>
</section>
<!-- Section: İçerik Tercihleri -->
<section class="mb-lg">
<h2 class="font-mono-label text-mono-label text-primary-fixed mb-sm uppercase">İçerik Tercihleri</h2>
<div class="bg-surface-container rounded-xl border border-outline-variant overflow-hidden">
<!-- Switch 1 -->
<label class="flex items-center justify-between p-md border-b border-outline-variant cursor-pointer group hover:bg-surface-variant/20 transition-colors">
<span class="font-body-lg text-body-lg">Orijinal başlıkları göster</span>
<div class="relative w-10 h-6 bg-surface-variant rounded-full switch-toggle border border-outline-variant">
<div class="absolute top-1 left-1 w-4 h-4 bg-on-surface-variant rounded-full switch-knob shadow-sm"></div>
</div>
</label>
<!-- Switch 2 (Active state demo) -->
<label class="flex items-center justify-between p-md cursor-pointer group hover:bg-surface-variant/20 transition-colors switch-active">
<span class="font-body-lg text-body-lg">Yabancı içerikleri otomatik Türkçe özetle</span>
<div class="relative w-10 h-6 bg-surface-variant rounded-full switch-toggle border border-primary-fixed-dim/30">
<div class="absolute top-1 left-1 w-4 h-4 bg-on-surface-variant rounded-full switch-knob shadow-sm"></div>
</div>
</label>
</div>
</section>
<!-- Explanation Text -->
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">Yabancı dildeki içerikler desteklenen çeviri ve özetleme hizmetleri kullanılarak Türkçe gösterilebilir. Teknik terimleri özgün hâliyle görmek için orijinal başlıkları açık tutabilirsiniz.</p>
</main>
<!-- Bottom Action Bar (Fixed relative to the container) -->
<div class="absolute bottom-0 w-full px-margin-mobile py-md pb-safe bg-surface-container-lowest/90 backdrop-blur-xl border-t border-outline-variant z-20">
<button class="w-full bg-primary-container text-on-primary-container font-mono-label text-mono-label py-4 rounded-xl flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-[0_0_15px_rgba(0,240,255,0.1)]">
<span class="material-symbols-outlined text-[18px]">save</span>
            Değişiklikleri Kaydet
        </button>
</div>
<script>
        // Simple toggle logic for the presentation
        document.querySelectorAll('label').forEach(label => {
            label.addEventListener('click', function(e) {
                // Prevent default label click behavior triggering multiple times if there were an actual input inside
                e.preventDefault(); 
                this.classList.toggle('switch-active');
                
                // Toggle visual border color for active state
                const toggle = this.querySelector('.switch-toggle');
                if(this.classList.contains('switch-active')) {
                    toggle.classList.remove('border-outline-variant');
                    toggle.classList.add('border-primary-fixed-dim/30');
                } else {
                    toggle.classList.add('border-outline-variant');
                    toggle.classList.remove('border-primary-fixed-dim/30');
                }
            });
        });
    </script>
</body></html>
