<style>
        body { background-color: #111317; color: #e2e2e8; }

        .toggle-checkbox:checked { right: 0; border-color: #00f0ff; }
        .toggle-checkbox:checked + .toggle-label { background-color: #00f0ff; }

<body class="antialiased min-h-screen flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop bg-background">
<!-- Modal Container -->
<div class="w-full max-w-[600px] glass-panel rounded-xl overflow-hidden shadow-2xl flex flex-col">
<!-- Header -->
<div class="flex justify-between items-center p-md border-b border-outline-variant">
<h2 class="font-headline-md text-headline-md text-primary">Paylaş</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<div class="p-lg flex flex-col gap-lg overflow-y-auto">
<!-- Preview Section -->
<div class="flex flex-col gap-sm">
<span class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-widest">Önizleme</span>
<div class="bg-surface-container-high rounded-xl p-md border border-primary/30 shadow-[0_0_15px_rgba(0,240,255,0.1)] flex flex-col gap-md transition-all">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-primary-fixed tracking-tight">Gemini 1.5 Pro</span>
<span class="font-mono-label text-mono-label text-on-surface-variant">Google DeepMind</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface-variant">vs</span>
<div class="flex flex-col text-right">
<span class="font-headline-md text-headline-md text-tertiary-fixed">GPT-4o</span>
<span class="font-mono-label text-mono-label text-on-surface-variant">OpenAI</span>
</div>
</div>
<div class="grid grid-cols-2 gap-sm">
<div class="bg-surface-container-high rounded p-sm border border-outline-variant flex flex-col">
<span class="font-mono-label text-mono-label text-on-surface-variant mb-1">MMLU Puanı</span>
<div class="flex justify-between items-end">
<span class="font-body-sm text-body-sm text-primary">81.9%</span>
<span class="font-body-sm text-body-sm text-tertiary-fixed">88.7%</span>
</div>
<div class="h-1 bg-surface-variant w-full mt-1 rounded-full overflow-hidden flex">
<div class="bg-primary h-full" style="width: 48%;"></div>
<div class="bg-tertiary-fixed h-full" style="width: 52%;"></div>
</div>
</div>
<div class="bg-surface-container-high rounded p-sm border border-outline-variant flex flex-col">
<span class="font-mono-label text-mono-label text-on-surface-variant mb-1">Bağlam Penceresi</span>
<div class="flex justify-between items-end">
<span class="font-body-sm text-body-sm text-primary">2M Token</span>
<span class="font-body-sm text-body-sm text-tertiary-fixed">128K Token</span>
</div>
</div>
</div>
</div>
</div>
<!-- Format Options -->
<div class="flex flex-col gap-sm">
<span class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-widest">Format</span>
<div class="grid grid-cols-2 gap-md">
<button class="bg-primary/10 border-2 border-primary text-primary rounded-xl p-md flex flex-col items-center justify-center gap-sm hover:bg-primary/20 transition-all group shadow-[0_0_10px_rgba(0,240,255,0.2)]">
<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform" data-icon="image">image</span>
<span class="font-mono-label text-mono-label">Görsel Kart</span>
</button>
<button class="bg-surface-container-low border border-outline-variant text-on-surface-variant rounded-xl p-md flex flex-col items-center justify-center gap-sm hover:border-primary/50 hover:text-primary transition-all group">
<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform" data-icon="subject">subject</span>
<span class="font-mono-label text-mono-label">Metin Özeti</span>
</button>
</div>
</div>

<div class="flex flex-col gap-md bg-surface-container-low p-md rounded-lg border border-outline-variant">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface">Benchmark Sonuçlarını Ekle</span>
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-surface border-4 appearance-none cursor-pointer border-outline-variant right-5 checked:right-0 checked:border-primary-container z-10" id="toggle1" name="toggle" type="checkbox">
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer checked:bg-primary-container" for="toggle1"></label>
</div>
</div>
<div class="w-full h-px bg-outline-variant"></div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface">Mimari Detayları Ekle</span>
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-surface border-4 appearance-none cursor-pointer border-outline-variant right-5 checked:right-0 checked:border-primary-container z-10" id="toggle2" name="toggle" type="checkbox">
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer checked:bg-primary-container" for="toggle2"></label>
</div>
</div>
</div>

<button class="w-12 h-12 rounded-xl bg-surface-container-high border border-outline-variant flex items-center justify-center hover:border-primary hover:bg-primary/5 hover:text-primary text-on-surface-variant transition-all shadow-sm">
<span class="font-headline-md font-bold">X</span>
</button>
<button class="w-12 h-12 rounded-xl bg-surface-container-high border border-outline-variant flex items-center justify-center hover:border-primary hover:bg-primary/5 hover:text-primary text-on-surface-variant transition-all shadow-sm">
<span class="font-headline-md font-bold">in</span>
</button>
<button class="w-12 h-12 rounded-xl bg-surface-container-high border border-outline-variant flex items-center justify-center hover:border-primary hover:bg-primary/5 hover:text-primary text-on-surface-variant transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
</button>
<button class="w-12 h-12 rounded-xl bg-surface-container-high border border-outline-variant flex items-center justify-center hover:border-primary hover:bg-primary/5 hover:text-primary text-on-surface-variant transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
<button class="w-12 h-12 rounded-xl bg-surface-container-high border border-outline-variant flex items-center justify-center hover:border-primary hover:bg-primary/5 hover:text-primary text-on-surface-variant transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="link">link</span>
</button>
</div>
</div>
</div>

<button class="flex-1 bg-transparent border border-outline-variant text-on-surface-variant rounded-lg font-mono-label text-mono-label py-md hover:bg-surface-variant hover:text-on-surface transition-all uppercase tracking-widest">İptal</button>
<button class="flex-1 bg-primary text-on-primary rounded-lg font-mono-label text-mono-label py-md hover:bg-primary-fixed transition-all flex items-center justify-center gap-xs shadow-[0_0_20px_rgba(0,240,255,0.3)] uppercase tracking-widest">
<span class="material-symbols-outlined text-sm" data-icon="share">share</span> Paylaş
            </button>
