<style>
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            margin-top: -75px;
            margin-left: -75px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(0, 240, 255, 0.4) 100%);
            animation: sweep 2s linear infinite;
            transform-origin: center;
        }

        .radar-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .radar-circle-1 { width: 100px; height: 100px; }
        .radar-circle-2 { width: 150px; height: 150px; }
        .radar-circle-3 { width: 200px; height: 200px; }

        @keyframes sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.8), transparent);
            animation: scan 3s ease-in-out infinite alternate;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
<style>
