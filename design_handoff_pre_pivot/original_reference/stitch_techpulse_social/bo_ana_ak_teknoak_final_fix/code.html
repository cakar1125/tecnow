<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Geist:wght@600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0c0e12;
            color: #e2e2e8;
            -webkit-font-smoothing: antialiased;
        }
        .glow-cyan {
            box-shadow: 0 0 15px rgba(0, 219, 233, 0.2);
        }
        .micro-grid {
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "secondary-container": "#571bc1",
                "on-tertiary-container": "#006d4a",
                "tertiary-fixed": "#6ffbbe",
                "inverse-surface": "#e2e2e8",
                "on-error": "#690005",
                "error-container": "#93000a",
                "error": "#ffb4ab",
                "on-secondary-fixed": "#23005c",
                "surface-tint": "#00dbe9",
                "surface-container-low": "#1a1c20",
                "primary-container": "#00f0ff",
                "surface-container-high": "#282a2e",
                "on-tertiary-fixed": "#002113",
                "inverse-on-surface": "#2f3035",
                "surface-variant": "#333539",
                "secondary-fixed-dim": "#d0bcff",
                "primary-fixed": "#7df4ff",
                "on-primary": "#00363a",
                "surface-dim": "#111317",
                "on-secondary": "#3c0091",
                "on-surface-variant": "#b9cacb",
                "on-primary-fixed-variant": "#004f54",
                "primary": "#dbfcff",
                "outline": "#849495",
                "on-tertiary-fixed-variant": "#005236",
                "on-background": "#e2e2e8",
                "background": "#111317",
                "on-error-container": "#ffdad6",
                "on-primary-fixed": "#002022",
                "surface-container-lowest": "#0c0e12",
                "on-surface": "#e2e2e8",
                "on-secondary-fixed-variant": "#5516be",
                "tertiary-fixed-dim": "#4edea3",
                "on-primary-container": "#006970",
                "tertiary-container": "#65f2b5",
                "surface-container": "#1e2024",
                "on-tertiary": "#003824",
                "primary-fixed-dim": "#00dbe9",
                "on-secondary-container": "#c4abff",
                "tertiary": "#d8ffe7",
                "surface": "#111317",
                "surface-container-highest": "#333539",
                "outline-variant": "#3b494b",
                "secondary": "#d0bcff",
                "surface-bright": "#37393e",
                "inverse-primary": "#006970",
                "secondary-fixed": "#e9ddff"
              },
              "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "0.75rem"
              },
              "spacing": {
                "xl": "32px",
                "sm": "8px",
                "margin-mobile": "16px",
                "margin-desktop": "32px",
                "xs": "4px",
                "lg": "24px",
                "md": "16px",
                "gutter": "16px",
                "base": "4px"
              },
              "fontFamily": {
                "body-sm": ["Inter"],
                "headline-lg-mobile": ["Geist"],
                "mono-label": ["JetBrains Mono"],
                "mono-code": ["JetBrains Mono"],
                "headline-md": ["Geist"],
                "headline-lg": ["Geist"],
                "body-lg": ["Inter"]

              "fontSize": {

                "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],

                "mono-code": ["13px", {"lineHeight": "1.5", "fontWeight": "400"}],
                "headline-md": ["20px", {"lineHeight": "1.3", "fontWeight": "600"}],

          },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen" style="background-color: #0A0C10; color: #e2e2e8; -webkit-font-smoothing: antialiased;">
<div class="w-full max-w-[390px] h-screen bg-[#0A0C10] relative overflow-hidden flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/60 border-b border-outline-variant/30 flex items-center justify-between px-margin-mobile h-16 w-full">
<span class="material-symbols-outlined text-primary transition-all duration-300 ease-in-out hover:opacity-80">grid_view</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter text-primary dark:text-primary-fixed-dim">TEKNOAKIŞ</h1>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant transition-all duration-300 ease-in-out hover:opacity-80">search</span>
</div>
</header>
<!-- Main Content (Empty State) -->
<main class="flex-1 flex flex-col items-center justify-center px-lg pt-16 pb-20 micro-grid">
<!-- Animated Hero Area -->
<div class="relative w-full aspect-square max-w-[280px] flex items-center justify-center mb-xl">
<!-- Decorative Rings -->
<div class="absolute inset-0 border border-primary/10 rounded-full animate-[spin_10s_linear_infinite]"></div>
<div class="absolute inset-4 border border-secondary/10 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
<!-- Central Icon Group -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-24 h-24 rounded-xl bg-primary/5 flex items-center justify-center border border-primary/20 glow-cyan mb-md relative overflow-hidden">
<div class="absolute inset-0 opacity-20">
<!-- High-end tech pattern -->
<div class="w-full h-full" style="background-image: radial-gradient(circle, #00dbe9 1px, transparent 1px); background-size: 8px 8px;"></div>
</div>
<span class="material-symbols-outlined text-[48px] text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">explore_nearby</span>
</div>
</div>
<!-- Floating Data Chips -->
</div>
<!-- Text Content -->
<div class="text-center space-y-md">
<h2 class="font-headline-md text-headline-md text-primary tracking-tight">Akışın henüz hazır değil</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant px-md leading-relaxed">İlgi alanlarını ve takip ettiğin kaynakları seçerek kişisel teknoloji akışını oluşturabilirsin.</p>
</div>
<!-- Action Buttons -->
<div class="w-full mt-xl space-y-sm">
<button class="w-full py-4 bg-primary-fixed-dim text-on-primary font-mono-label rounded-xl glow-cyan flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all">İlgi Alanlarını Düzenle <span class="material-symbols-outlined text-md">tune</span></button>
<button class="w-full py-4 border border-outline-variant text-on-surface-variant font-mono-label rounded-xl flex items-center justify-center gap-2 hover:bg-surface-variant/20 active:scale-[0.98] transition-all">Kaynakları Keşfet <span class="material-symbols-outlined text-md">explore</span></button>
<div class="flex justify-center pt-md">
<button class="p-2 text-on-surface-variant/60 hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-lg">refresh</span>
<span class="font-mono-label text-[10px] uppercase">Yenile</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 backdrop-blur-lg bg-surface/80 border-t border-outline-variant/20 flex justify-around items-center h-20 w-full px-4 pb-safe">
<a class="flex items-center justify-center bg-primary/10 text-primary rounded-xl p-3 shadow-[0_0_15px_rgba(0,219,233,0.2)] active:scale-90 transition-transform duration-200 glow-cyan" href="#">
<span class="material-symbols-outlined">terminal</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">explore</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">notifications</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">bookmark</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">account_circle</span>
</a>
</nav>
<!-- Dynamic Particle Overlay (Canvas simulation) -->
<div class="pointer-events-none absolute inset-0 z-[1] opacity-20">
<svg class="w-full h-full">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path class="text-primary/10" d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
</div>
<script>
        // Micro-interaction: Mouse parallax for the "Empty state" icons
        document.addEventListener('mousemove', (e) => {
            const icons = document.querySelectorAll('.material-symbols-outlined');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            
            icons.forEach(icon => {
                if(icon.closest('.relative.z-10')) {
                    icon.style.transform = `translateX(${x}px) translateY(${y}px)`;
                }
            });
        });

        // Simulating loading sequence on refresh click
        const refreshBtn = document.querySelector('button .material-symbols-outlined:first-child');
        refreshBtn.parentElement.addEventListener('click', () => {
            refreshBtn.classList.add('animate-spin');
            setTimeout(() => {
                refreshBtn.classList.remove('animate-spin');
            }, 1000);
        });
    </script>
</body></html>
