<style>
        body {
            background-color: #0c0e12;
            color: #e2e2e8;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom scrollbar for a technical feel */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b494b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00dbe9; }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-container-lowest text-on-background flex flex-col min-h-screen">
<!-- TopAppBar (Transactional - Nav hidden, Back action prominent) -->
<header class="bg-surface/60 backdrop-blur-md border-b border-outline-variant/30 fixed top-0 w-full z-50 flex justify-between items-center px-md h-16">
<button aria-label="Geri" class="text-primary-fixed-dim hover:text-primary-fixed hover:transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md tracking-tighter text-primary-fixed-dim">İçerik Şikâyeti</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-margin-mobile py-lg pb-32 flex flex-col gap-lg max-w-[1200px] mx-auto w-full">
<!-- Target Post Preview (Bento/Card style) -->
<section class="bg-surface-container-low border border-outline-variant rounded-xl p-md flex flex-col gap-sm">
<div class="flex items-center gap-sm mb-xs">
<span class="material-symbols-outlined text-outline text-sm">visibility</span>
<span class="font-mono-label text-mono-label text-outline uppercase">Hedef İçerik</span>
</div>
<div class="flex items-start gap-md">
<div class="w-12 h-12 rounded bg-surface-variant overflow-hidden flex-shrink-0" data-alt="A futuristic avatar profile picture showing a glowing, abstract polygonal face in deep tech blues and blacks, matching the Hyper-Technical Minimalism aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAkYNwQmMzNJIOr6HoeykiML6N0gkBRk3fyM-TzBO87QUP9QGiChvDbc2DGi14aBOk1c647PcrYvl2RFTkk3KtfjcPlrLjzGhgnJ3y1gp_rGIpIj6XCAVD2whkLgmlRU5xcAS5s3Sirith_dxuei97Fx5JQr1AIEcSc1K663VpknBs5OHOV7D2AaqabK-yNk7_pJxLAbR5qGlHn4CM5YsOQpzuZp2ndcVLVgm5Ju86-Xd58fUZ-L-MIQD5ez__jzN3BkbfYMISm3qM')"></div>
<div>
<h3 class="font-body-sm text-body-sm text-on-surface font-semibold">Yeni Nesil Kuantum Çipleri Hakkında İddialar</h3>
<p class="font-mono-code text-mono-code text-on-surface-variant line-clamp-2 mt-xs text-xs">Son sızıntılara göre yeni mimari %400 performans artışı vadediyor ancak enerji tüketimi gizleniyor...</p>
<div class="mt-sm flex gap-xs">
<span class="bg-surface-variant text-on-surface-variant px-2 py-1 rounded font-mono-label text-[10px]">#donanım</span>
</div>
</div>
</div>
</section>
<!-- Complaint Form -->
<form class="flex flex-col gap-lg">
<!-- Reason Selection -->
<fieldset class="flex flex-col gap-md">
<legend class="font-body-lg text-body-lg font-medium text-on-surface mb-sm">Şikâyet Nedeni Seçin</legend>
<div class="grid grid-cols-1 gap-sm">
<!-- Reason Options -->
<label class="flex items-center justify-between p-sm border border-outline-variant rounded-lg bg-surface hover:border-primary-fixed-dim transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary-fixed-dim">gpp_bad</span>
<span class="font-body-sm text-body-sm text-on-surface">Yanlış bilgi</span>
</div>
<input class="w-4 h-4 text-primary-fixed-dim bg-surface-container border-outline-variant focus:ring-primary-fixed-dim focus:ring-2 rounded-full" name="reason" type="radio" value="misinfo"/>
</label>
<label class="flex items-center justify-between p-sm border border-outline-variant rounded-lg bg-surface hover:border-primary-fixed-dim transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary-fixed-dim">report</span>
<span class="font-body-sm text-body-sm text-on-surface">Spam</span>
</div>
<input class="w-4 h-4 text-primary-fixed-dim bg-surface-container border-outline-variant focus:ring-primary-fixed-dim focus:ring-2 rounded-full" name="reason" type="radio" value="spam"/>
</label>
<label class="flex items-center justify-between p-sm border border-outline-variant rounded-lg bg-surface hover:border-primary-fixed-dim transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary-fixed-dim">copyright</span>
<span class="font-body-sm text-body-sm text-on-surface">Telif hakkı</span>
</div>
<input class="w-4 h-4 text-primary-fixed-dim bg-surface-container border-outline-variant focus:ring-primary-fixed-dim focus:ring-2 rounded-full" name="reason" type="radio" value="copyright"/>
</label>
<label class="flex items-center justify-between p-sm border border-outline-variant rounded-lg bg-surface hover:border-error transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-error">link_off</span>
<span class="font-body-sm text-body-sm text-on-surface">Zararlı bağlantı</span>
</div>
<input class="w-4 h-4 text-error bg-surface-container border-outline-variant focus:ring-error focus:ring-2 rounded-full" name="reason" type="radio" value="malicious"/>
</label>
<label class="flex items-center justify-between p-sm border border-outline-variant rounded-lg bg-surface hover:border-error transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-error">warning</span>
<span class="font-body-sm text-body-sm text-on-surface">Uygunsuz içerik</span>
</div>
<input class="w-4 h-4 text-error bg-surface-container border-outline-variant focus:ring-error focus:ring-2 rounded-full" name="reason" type="radio" value="inappropriate"/>
</label>
<label class="flex items-center justify-between p-sm border border-outline-variant rounded-lg bg-surface hover:border-primary-fixed-dim transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary-fixed-dim">more_horiz</span>
<span class="font-body-sm text-body-sm text-on-surface">Diğer</span>
</div>
<input class="w-4 h-4 text-primary-fixed-dim bg-surface-container border-outline-variant focus:ring-primary-fixed-dim focus:ring-2 rounded-full" name="reason" type="radio" value="other"/>
</label>
</div>
</fieldset>
<!-- Description Area -->
<div class="flex flex-col gap-xs">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase" for="details">Detaylı Açıklama (İsteğe Bağlı)</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-md font-mono-code text-mono-code text-on-surface focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors outline-none resize-none placeholder:text-outline-variant" id="details" placeholder="Lütfen şikâyetinizi destekleyen detayları buraya girin..." rows="4"></textarea>
</div>
</form>
</main>
<!-- Bottom Action Area (Sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant/30 p-md pb-safe">
<div class="flex gap-md max-w-[1200px] mx-auto w-full">
<button class="flex-1 py-sm px-md border border-primary-fixed-dim text-primary-fixed-dim rounded-lg font-mono-label text-mono-label hover:bg-primary-fixed-dim/10 active:scale-95 transition-all text-center">
                Vazgeç
            </button>
<button class="flex-1 py-sm px-md bg-primary-fixed-dim text-on-primary-container rounded-lg font-mono-label text-mono-label hover:bg-primary-fixed active:scale-95 transition-all text-center flex justify-center items-center gap-xs">
<span class="material-symbols-outlined" style="font-size: 16px;">send</span>
                Şikâyeti Gönder
            </button>
</div>
</div>
<!-- Note: BottomNavBar is suppressed due to Transactional page intent (Complaint Flow with 'Back'/'Cancel' actions). -->
</body></html>
