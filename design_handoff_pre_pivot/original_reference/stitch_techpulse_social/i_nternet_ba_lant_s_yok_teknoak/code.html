<style>
        body {
            background-color: #0A0C10; /* Strict adherence to requested hex, overriding theme surface for strict matching */
        }
        
        /* Subtle glow animation for the offline icon */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 219, 233, 0.2)); }
            50% { filter: drop-shadow(0 0 16px rgba(0, 219, 233, 0.5)); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Scanline effect for background */
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,219,233,0.02) 50%, rgba(0,219,233,0.02));

        }

<body class="text-on-surface h-screen w-full flex flex-col items-center justify-center overflow-hidden antialiased">
<!-- Max-width container matching mobile constraint -->
<div class="relative w-full h-full max-w-[390px] flex flex-col border-x border-outline-variant/30 shadow-2xl bg-[#0A0C10]">
<!-- Scanline overlay -->
<div class="absolute inset-0 scanlines z-0"></div>
<!-- Background Grid Decoration -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at center, #00dbe9 1px, transparent 1px); background-size: 24px 24px;"></div>
<!-- TopAppBar Shared Component Logic -->
<header class="fixed top-0 w-full max-w-[390px] z-50 flex justify-between items-center px-margin-mobile h-16 backdrop-blur-xl border-b border-outline-variant bg-surface/60">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-sm rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">TeknoAkış</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-sm rounded-full">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-lg pt-24 pb-8 z-10 relative">
<!-- Illustration / Icon Area -->
<div class="mb-8 relative flex items-center justify-center">
<!-- Abstract offline rings -->
<div class="absolute w-32 h-32 rounded-full border border-surface-variant"></div>
<div class="absolute w-24 h-24 rounded-full border border-outline-variant border-dashed opacity-50 animate-[spin_10s_linear_infinite]"></div>
<!-- Core Icon -->
<div class="w-16 h-16 rounded-xl bg-surface-container-high border border-outline-variant flex items-center justify-center animate-pulse-glow z-10">
<span class="material-symbols-outlined text-4xl text-surface-tint" data-icon="wifi_off" style="font-variation-settings: 'FILL' 1;">wifi_off</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center mb-10 max-w-[280px]">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-4">
                    İnternet bağlantısı yok
                </h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Bağlantını kontrol ettikten sonra yeniden deneyebilirsin. Daha önce yüklenen bazı içerikler çevrimdışı olarak görüntülenebilir.
                </p>
</div>
<!-- Actions Cluster -->
<div class="w-full flex flex-col gap-4 mb-8">
<!-- Primary Action -->
<button class="w-full py-3 px-4 rounded bg-primary-container text-on-primary-container font-mono-label text-mono-label font-bold text-center active:scale-[0.98] transition-transform flex justify-center items-center gap-2" onclick="window.location.reload()">
<span class="material-symbols-outlined text-[16px]" data-icon="refresh">refresh</span>
                    Yeniden Dene
                </button>
<!-- Secondary Action -->
<button class="w-full py-3 px-4 rounded border border-outline-variant bg-surface-container-low text-on-surface font-mono-label text-mono-label font-bold text-center active:scale-[0.98] transition-all hover:border-surface-tint/50 flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="download_done">download_done</span>
                    İndirilen İçerikleri Gör
                </button>
<!-- Tertiary Link -->
<button class="w-full py-3 px-4 text-surface-tint font-mono-label text-mono-label font-bold text-center hover:opacity-80 transition-opacity flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="home">home</span>
                    Ana Sayfa
                </button>
</div>

<div class="mt-auto pt-4 border-t border-outline-variant/30 w-full text-center">
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-mono-code text-mono-code text-[11px] opacity-70">
<span class="w-2 h-2 rounded-full bg-surface-tint animate-pulse"></span>
                    Bağlantı geldiğinde otomatik yenilenecektir.
                </div>
</div>

<!-- Nav is suppressed as per semantic shell mandate for transactional/dead-end states -->
</div>
