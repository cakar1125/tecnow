<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>

<style>
        /* Custom Radio Button Styling for Tech Aesthetic */
        input[type="radio"]:checked + div {
            border-color: #00dbe9; /* primary-fixed-dim */
            background-color: rgba(0, 219, 233, 0.1);
            box-shadow: 0 0 8px rgba(0, 219, 233, 0.2);
        }
        input[type="radio"]:checked + div .radio-inner {
            background-color: #00dbe9;
            transform: scale(1);
        }
        
        /* Subtle grid background for the tech feel */
        .bg-tech-grid {
            background-image: 
                linear-gradient(to right, rgba(59, 73, 75, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 73, 75, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-sm w-full h-screen overflow-x-hidden flex flex-col items-center bg-tech-grid">
<!-- Mobile Viewport Container Constraint -->
<div class="w-full max-w-[390px] h-full mx-auto relative flex flex-col shadow-2xl bg-background border-x border-outline-variant/20">
<!-- TopAppBar (Shared Component - Injected Styles Applied) -->
<header class="fixed top-0 w-full max-w-[390px] z-50 bg-surface/60 backdrop-blur-md dark:bg-surface/60 border-b border-outline-variant/30 flex justify-between items-center px-md h-16">
<button class="text-on-surface-variant hover:text-primary-fixed hover:transition-colors active:scale-95 transition-transform flex items-center justify-center p-sm">
<span class="material-symbols-outlined">terminal</span>
</button>
<h1 class="font-headline-md text-headline-md tracking-tighter text-primary-fixed-dim">TeknoAkış</h1>
<button class="text-on-surface-variant hover:text-primary-fixed hover:transition-colors active:scale-95 transition-transform flex items-center justify-center p-sm">
<span class="material-symbols-outlined">settings_input_component</span>
</button>
</header>
<!-- Main Content Area (Padding top for fixed header, padding bottom for actions) -->
<main class="flex-1 overflow-y-auto pt-[80px] pb-[100px] px-md flex flex-col gap-lg">
<!-- Context Header -->
<div class="flex flex-col gap-xs">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Kullanıcı Şikâyeti</h2>
<p class="font-mono-label text-mono-label text-on-surface-variant">RPT_ID: <span class="text-primary-fixed-dim">#A94F-22B</span></p>
</div>
<!-- Reported User Card -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-md flex items-center gap-md relative overflow-hidden group">
<!-- Subtle glow effect on hover -->
<div class="absolute inset-0 bg-primary-fixed-dim/0 group-hover:bg-primary-fixed-dim/5 transition-colors duration-300 pointer-events-none"></div>
<div class="relative w-12 h-12 rounded-full overflow-hidden border border-outline-variant shrink-0 bg-surface-container-highest">
<img class="w-full h-full object-cover" data-alt="A futuristic cyberpunk avatar portrait of an anonymous tech user, illuminated by neon cyan and deep purple light, highly detailed digital painting style, solid black background, conveying a sense of mystery and high-tech environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA76Q6EiWGpEyXU5YbAkSjbXBBdVWeXyESt9-hko2J-YBCqk3v6C-pFu6MWBm0nypCGoGaDER3SMyNtnfjbxhBvDImKHzlsxTMATOWAZKnyQjdIbD_pVehLDFKWJWOMewdWSs9re58nqGQp9J6F9uhF6su17zhwbqzzMlls9pRJKhRwaBlYFZQMMGQ7f-KUVB3hNHyLGAPAt7gCVOQfd2jAPqK0UjUBckS7p9MKvNWIV6ah5hJOe_z8kXl7upd3_2F4pD2C6dI-zi4"/>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface leading-none mb-xs">DataGhost_99</span>
<span class="font-mono-label text-mono-label text-on-surface-variant">@dataghost_99</span>
</div>
<div class="ml-auto">
<span class="material-symbols-outlined text-error opacity-50">warning</span>
</div>
</div>
<!-- Complaint Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Radio Group: Reasons -->
<fieldset class="flex flex-col gap-sm">
<legend class="font-mono-label text-mono-label text-on-surface mb-sm flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">rule</span> LÜTFEN BİR NEDEN SEÇİN
                    </legend>
<!-- Option 1 -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="complaint_reason" required="" type="radio" value="spam"/>
<div class="flex items-center p-md bg-surface-container border border-outline-variant rounded-lg transition-all duration-200 group-hover:border-outline">
<div class="w-4 h-4 rounded-full border border-outline-variant flex items-center justify-center mr-sm shrink-0">
<div class="radio-inner w-2 h-2 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-sm text-body-sm text-on-surface">Spam</span>
</div>
</label>
<!-- Option 2 -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="complaint_reason" type="radio" value="taciz"/>
<div class="flex items-center p-md bg-surface-container border border-outline-variant rounded-lg transition-all duration-200 group-hover:border-outline">
<div class="w-4 h-4 rounded-full border border-outline-variant flex items-center justify-center mr-sm shrink-0">
<div class="radio-inner w-2 h-2 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-sm text-body-sm text-on-surface">Taciz</span>
</div>
</label>
<!-- Option 3 -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="complaint_reason" type="radio" value="sahte_hesap"/>
<div class="flex items-center p-md bg-surface-container border border-outline-variant rounded-lg transition-all duration-200 group-hover:border-outline">
<div class="w-4 h-4 rounded-full border border-outline-variant flex items-center justify-center mr-sm shrink-0">
<div class="radio-inner w-2 h-2 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-sm text-body-sm text-on-surface">Sahte hesap</span>
</div>
</label>
<!-- Option 4 -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="complaint_reason" type="radio" value="zararli_icerik"/>
<div class="flex items-center p-md bg-surface-container border border-outline-variant rounded-lg transition-all duration-200 group-hover:border-outline">
<div class="w-4 h-4 rounded-full border border-outline-variant flex items-center justify-center mr-sm shrink-0">
<div class="radio-inner w-2 h-2 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-sm text-body-sm text-on-surface text-error/90">Zararlı içerik</span>
</div>
</label>
<!-- Option 5 -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="complaint_reason" type="radio" value="diger"/>
<div class="flex items-center p-md bg-surface-container border border-outline-variant rounded-lg transition-all duration-200 group-hover:border-outline">
<div class="w-4 h-4 rounded-full border border-outline-variant flex items-center justify-center mr-sm shrink-0">
<div class="radio-inner w-2 h-2 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-sm text-body-sm text-on-surface">Diğer</span>
</div>
</label>
</fieldset>
<!-- Text Area: Details -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant flex justify-between" for="complaint_details">
<span>EK DETAYLAR</span>
<span class="opacity-50">[OPTIONAL]</span>
</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-md font-mono-code text-mono-code text-on-surface placeholder:text-outline focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim/50 transition-all outline-none resize-none" id="complaint_details" name="complaint_details" placeholder="İhlali açıklayan bağlantılar veya log verileri girin..." rows="4"></textarea>
</div>
</form>
</main>
<!-- Fixed Action Bottom Bar -->
<div class="absolute bottom-0 w-full p-md bg-surface/90 backdrop-blur-md border-t border-outline-variant/30 flex flex-col gap-sm pb-safe z-40">
<button class="w-full bg-primary-fixed-dim text-[#002022] font-mono-label text-mono-label py-md rounded-lg flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-[0_0_15px_rgba(0,219,233,0.15)] hover:shadow-[0_0_20px_rgba(0,219,233,0.3)]" type="submit">
<span class="material-symbols-outlined text-[18px]">send</span>
                ŞİKÂYETİ GÖNDER
            </button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-mono-label text-mono-label py-md rounded-lg flex items-center justify-center gap-sm active:scale-[0.98] transition-transform hover:bg-surface-container-high hover:border-outline" type="button">
                VAZGEÇ
            </button>
</div>
</div>
</body></html>
