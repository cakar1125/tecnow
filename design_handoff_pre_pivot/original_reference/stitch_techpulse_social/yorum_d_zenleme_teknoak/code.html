<!-- Main Canvas -->

<!-- Content Context Card (Read-only snippet of what is being commented on) -->

<div class="flex items-center gap-2">

            </p>

<!-- Edit Form Section -->

<!-- Textarea -->
<textarea class="flex-1 w-full bg-surface-container rounded-lg border border-outline-variant focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim text-on-surface font-mono-code text-mono-code p-md resize-none transition-colors outline-none h-64" id="comment-edit" maxlength="500" placeholder="Yorumunuzu buraya yazın...">Kesinlikle katılıyorum. Ancak şu anki qubit hata oranları (error rates) hala pratik uygulamalar için çok yüksek. Shor algoritmasının büyük ölçekte çalıştırılması için donanımsal düzeyde ciddi atılımlar gerekiyor. Belki topolojik kuantum bilgisayarlar bu sorunu çözebilir.</textarea>

<div class="w-1.5 h-1.5 rounded-full bg-tertiary-fixed-dim"></div>
</div>
</div>

            </p>

            </button>
<button class="flex-1 bg-primary-fixed-dim text-on-primary-container font-mono-label text-mono-label uppercase tracking-wider py-md rounded-lg active:scale-95 transition-transform text-center font-bold hover:brightness-110" id="save-btn" type="button">
                Değişiklikleri Kaydet
            </button>

<!-- Suppressed BottomNavBar: Task-focused flow (editing) implies temporary departure from main nav -->
<script>
        // Simple character counter logic
        const textarea = document.getElementById('comment-edit');
        const counter = document.getElementById('char-counter');
        const saveBtn = document.getElementById('save-btn');
        const maxLength = 500;
        
        // Initial state
        const initialText = textarea.value;

        textarea.addEventListener('input', function() {
            const currentLength = this.value.length;
            counter.textContent = `${currentLength}/${maxLength}`;
            
            // Visual feedback as it gets closer to max
            if (currentLength >= maxLength - 20) {
                counter.classList.replace('text-on-surface-variant', 'text-error');
            } else {
                counter.classList.replace('text-error', 'text-on-surface-variant');
            }

            // Button state logic (disable if empty or unchanged)
            if (currentLength === 0 || this.value === initialText) {
                saveBtn.classList.replace('bg-primary-fixed-dim', 'bg-surface-variant');
                saveBtn.classList.replace('text-on-primary-container', 'text-outline');
                saveBtn.classList.add('opacity-50', 'cursor-not-allowed');
                saveBtn.disabled = true;
            } else {
                saveBtn.classList.replace('bg-surface-variant', 'bg-primary-fixed-dim');
                saveBtn.classList.replace('text-outline', 'text-on-primary-container');
                saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                saveBtn.disabled = false;
            }
        });
    </script>
