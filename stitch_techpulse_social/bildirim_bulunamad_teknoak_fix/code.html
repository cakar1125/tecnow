            left: 0;

            0% { top: 0; }

<body class="flex justify-center min-h-screen font-body-sm text-body-sm overflow-hidden">
<!-- Main Device Container (Max-width 390px as requested) -->
<main class="w-full max-w-[390px] bg-surface-container-lowest min-h-screen relative flex flex-col border-x border-outline-variant/20 shadow-2xl">
<!-- Top App Bar -->
<header class="fixed top-0 w-full max-w-[390px] z-50 backdrop-blur-xl bg-surface/60 border-b border-outline-variant/30 flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">grid_view</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter text-primary">TEKNOAKIŞ</h1>
</div>
<span class="material-symbols-outlined text-on-surface-variant">settings</span>
</header>
<!-- Content Area -->
<section class="flex-1 flex flex-col items-center justify-center px-lg pt-16 pb-20">
<!-- Animated Background Canvas for Atmosphere -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20">
</div>
<!-- Empty State Illustration Container -->
<div class="relative z-10 w-full flex flex-col items-center text-center">
<!-- Abstract Technical Visualizer -->
<div class="relative w-48 h-48 mb-lg flex items-center justify-center">
<div class="absolute inset-0 border border-primary/20 rounded-full animate-pulse"></div>
<div class="absolute inset-4 border border-primary/10 rounded-full"></div>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-primary-fixed-dim opacity-40" style="font-variation-settings: 'FILL' 1;">notifications_off</span>
</div>
<!-- Technical Orbitals -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-2 h-2 bg-primary rounded-full shadow-[0_0_8px_rgba(0,219,233,0.6)]"></div>
<!-- Decorative Scanline Overlay -->
<div class="absolute inset-0 overflow-hidden rounded-full">
<div class="scanline"></div>
</div>
</div>
<!-- Text Content -->
<div class="space-y-md mb-xl">
<h2 class="font-headline-md text-headline-md text-primary tracking-tight">Henüz bildirimin yok</h2>
<p class="font-body-sm text-on-surface-variant leading-relaxed">Takip ettiğin kaynaklar, repository’ler ve konularla ilgili önemli gelişmeler burada görünecek.</p>
</div>
<!-- Action Group -->
<div class="flex flex-col w-full gap-md">
<button class="w-full bg-primary-fixed-dim text-on-primary py-md px-lg rounded-xl font-bold transition-all duration-200 active:scale-95 shadow-[0_0_20px_rgba(0,219,233,0.15)] flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined text-[18px]">search</span>
                        Kaynakları Keşfet
                    </button>
<button class="w-full flex items-center justify-center gap-2 py-sm text-on-surface-variant font-mono-label hover:text-primary transition-colors duration-200 group">
<span class="material-symbols-outlined text-[16px]">tune</span>
                        Bildirim Tercihleri
                    </button>
</div>
</div>
<!-- Recent Activity Indicator (Ghost Pattern) -->
</section>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full max-w-[390px] z-50 backdrop-blur-lg bg-surface/80 border-t border-outline-variant/20 flex justify-around items-center h-20 px-4 pb-safe">
<a class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">terminal</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">explore</span>
</a>
<a class="flex items-center justify-center bg-primary/10 text-primary rounded-xl p-3 shadow-[0_0_15px_rgba(0,219,233,0.2)] active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">notifications</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">bookmark</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">account_circle</span>
</a>
</nav>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('touchstart', () => {
                    button.classList.add('opacity-80');
                });
                button.addEventListener('touchend', () => {
                    button.classList.remove('opacity-80');
                });
            });
            
            // Subtle ambient rotation for the empty state orbital
            const orbital = document.querySelector('.relative.w-48.h-48');
            let angle = 0;
            function rotateOrbital() {
                angle += 0.05;
                if(orbital) {
                    const orb = orbital.querySelector('.absolute.top-0');
                    const radius = 96; // half of 48*4 (since w-48 is 12rem = 192px)
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    // Note: Manual calculation for smooth JS orbit if CSS isn't enough
                    // But CSS animation is preferred for performance. 
                    // Keeping simple CSS Pulse for now as defined in HTML.
                }
                requestAnimationFrame(rotateOrbital);
            }
            // rotateOrbital();
        });
    </script>
