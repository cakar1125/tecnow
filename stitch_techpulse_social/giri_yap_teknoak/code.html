<script>
        // Simple script to add an active glow effect based on mouse position for the login card
        const card = document.querySelector('.group');
        
        document.addEventListener('mousemove', (e) => {
            if(!card) return;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Check if mouse is near the card
            if (e.clientX > rect.left - 100 && e.clientX < rect.right + 100 &&
                e.clientY > rect.top - 100 && e.clientY < rect.bottom + 100) {
                card.style.boxShadow = `0 0 30px rgba(0, 240, 255, 0.05), inset 0 0 20px rgba(0, 240, 255, 0.02)`;
                card.style.borderColor = 'var(--tw-colors-primary)';
            } else {
                card.style.boxShadow = '';
                card.style.borderColor = '';
            }
        });
        
        // Remove style when mouse leaves the document to clean up
        document.addEventListener('mouseleave', () => {
             if(!card) return;
             card.style.boxShadow = '';
             card.style.borderColor = '';
        });
    </script>
