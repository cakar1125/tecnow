<style>

        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 20px;
            height: 20px;
            border: 1px solid #3b494b;
            border-radius: 4px;
            display: grid;
            place-content: center;
            transition: all 0.2s ease;
        }

        .custom-checkbox::before {
            content: "";
            width: 12px;
            height: 12px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #000000;
            background-color: #000000;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #dbfcff;
            border-color: #dbfcff;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('.item-selector');
            const compareBtn = document.getElementById('compareBtn');
            const maxSelection = 2;

            function updateUI() {
                const checkedBoxes = document.querySelectorAll('.item-selector:checked');
                const count = checkedBoxes.length;

                // Update cards styling
                checkboxes.forEach(cb => {
                    const card = cb.closest('.item-card');
                    if (cb.checked) {
                        card.classList.add('selected');
                    } else {
                        card.classList.remove('selected');
                    }
                    
                    // Disable unchecked if max reached
                    if (count >= maxSelection && !cb.checked) {
                        cb.disabled = true;
                        card.classList.add('opacity-50');
                    } else {
                        cb.disabled = false;
                        card.classList.remove('opacity-50');
                    }
                });

                // Update button
                compareBtn.textContent = `Karşılaştır (${count}/${maxSelection})`;
                if (count === maxSelection) {
                    compareBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                    compareBtn.classList.add('bg-primary', 'text-on-primary', 'font-bold', 'shadow-[0_0_15px_rgba(0,219,233,0.3)]');
                } else {
                    compareBtn.classList.add('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                    compareBtn.classList.remove('bg-primary', 'text-on-primary', 'font-bold', 'shadow-[0_0_15px_rgba(0,219,233,0.3)]');
                }
            }

            checkboxes.forEach(cb => {
                cb.addEventListener('change', updateUI);
            });
        });
    </script>
