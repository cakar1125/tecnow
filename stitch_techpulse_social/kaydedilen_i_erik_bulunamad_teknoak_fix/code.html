<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-container": "#571bc1",
                    "on-tertiary-container": "#006d4a",
                    "tertiary-fixed": "#6ffbbe",
                    "inverse-surface": "#e2e2e8",
                    "on-error": "#690005",
                    "error-container": "#93000a",
                    "error": "#ffb4ab",
                    "on-secondary-fixed": "#23005c",
                    "surface-tint": "#00dbe9",
                    "surface-container-low": "#1a1c20",
                    "primary-container": "#00f0ff",
                    "surface-container-high": "#282a2e",
                    "on-tertiary-fixed": "#002113",
                    "inverse-on-surface": "#2f3035",
                    "surface-variant": "#333539",
                    "secondary-fixed-dim": "#d0bcff",
                    "primary-fixed": "#7df4ff",
                    "on-primary": "#00363a",
                    "surface-dim": "#111317",
                    "on-secondary": "#3c0091",
                    "on-surface-variant": "#b9cacb",
                    "on-primary-fixed-variant": "#004f54",
                    "primary": "#dbfcff",
                    "outline": "#849495",
                    "on-tertiary-fixed-variant": "#005236",
                    "on-background": "#e2e2e8",
                    "background": "#0A0C10",
                    "on-error-container": "#ffdad6",
                    "on-primary-fixed": "#002022",
                    "surface-container-lowest": "#0c0e12",
                    "on-surface": "#e2e2e8",
                    "on-secondary-fixed-variant": "#5516be",
                    "tertiary-fixed-dim": "#4edea3",
                    "on-primary-container": "#006970",
                    "tertiary-container": "#65f2b5",
                    "surface-container": "#1e2024",
                    "on-tertiary": "#003824",
                    "primary-fixed-dim": "#00dbe9",
                    "on-secondary-container": "#c4abff",
                    "tertiary": "#d8ffe7",
                    "surface": "#111317",
                    "surface-container-highest": "#333539",
                    "outline-variant": "#3b494b",
                    "secondary": "#d0bcff",
                    "surface-bright": "#37393e",
                    "inverse-primary": "#006970",
                    "secondary-fixed": "#e9ddff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "xl": "32px",
                    "sm": "8px",
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "xs": "4px",
                    "lg": "24px",
                    "md": "16px",
                    "gutter": "16px",
                    "base": "4px"
            },
            "fontFamily": {
                    "body-sm": ["Inter"],
                    "headline-lg-mobile": ["Geist"],
                    "mono-label": ["JetBrains Mono"],
                    "mono-code": ["JetBrains Mono"],
                    "headline-md": ["Geist"],
                    "headline-lg": ["Geist"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "mono-label": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "mono-code": ["13px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0A0C10;
            color: #e2e2e8;
            -webkit-font-smoothing: antialiased;
        }
        .glass-header {
            backdrop-filter: blur(12px);
            background: rgba(17, 19, 23, 0.6);
        }
        .tech-gradient-text {
            background: linear-gradient(135deg, #dbfcff 0%, #00dbe9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .micro-grid {
            background-image: radial-gradient(circle, #2d3139 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col items-center min-h-screen overflow-x-hidden">
<!-- Top AppBar -->
<header class="fixed top-0 w-full max-w-[390px] z-50 backdrop-blur-xl border-b border-outline-variant/30 bg-surface/60 h-16 flex items-center justify-between px-margin-mobile">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="grid_view">grid_view</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter text-primary">TEKNOAKIŞ</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-all" data-icon="search">search</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[390px] pt-16 pb-20 flex flex-col items-center justify-center px-margin-mobile micro-grid">
<!-- Empty State Illustration/Icon -->
<div class="relative mb-8 group">
<!-- Decorative atmospheric glow -->
<div class="absolute -inset-4 bg-primary/10 rounded-full blur-2xl group-hover:bg-primary/20 transition-all duration-700"></div>
<div class="relative w-24 h-24 rounded-full border border-outline-variant/40 bg-surface-container-low flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-primary/40 text-5xl transform -rotate-12 transition-transform duration-500 group-hover:rotate-0" data-icon="bookmark">bookmark</span>
<!-- Micro-visual instruction for "Save" -->
<div class="absolute bottom-2 right-2 w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center shadow-lg transform rotate-6 border border-primary/20">
<span class="material-symbols-outlined text-on-primary-container text-sm" data-icon="add" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
</div>
</div>
<!-- Typography Section -->
<div class="text-center space-y-4 mb-10 px-4">
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">Henüz içerik kaydetmedin</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
                Daha sonra incelemek istediğin repository, AI modeli ve teknoloji duyurularını kaydedebilirsin.
            </p>
</div>
<!-- Action Grid -->
<div class="w-full space-y-3">
<button class="w-full py-4 bg-primary-fixed-dim text-on-primary font-mono-label uppercase tracking-widest rounded-xl hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(0,219,233,0.15)]"><span class="material-symbols-outlined text-sm" data-icon="explore">explore</span>Keşfetmeye Başla</button>
<button class="w-full py-4 bg-transparent border border-outline-variant text-primary font-mono-label uppercase tracking-widest rounded-xl hover:bg-surface-variant/20 active:scale-95 transition-all flex items-center justify-center gap-2"><span class="material-symbols-outlined text-sm" data-icon="create_new_folder">create_new_folder</span>Koleksiyon Oluştur</button>
</div>
<!-- Contextual Hint -->
<div class="mt-12 p-4 rounded-xl bg-surface-container-lowest border border-outline-variant/20 flex items-start gap-3 w-full">
<span class="material-symbols-outlined text-primary text-md" data-icon="info">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant/80">Bir içeriğin üzerindeki kaydet simgesine dokunarak daha sonra incelemek üzere saklayabilirsin.</p>
</div>
</main>
<!-- Bottom Navigation Bar -->
<!-- Active State Logic: Profile tab (account_circle) is active as per user request -->
<nav class="fixed bottom-0 w-full max-w-[390px] z-50 backdrop-blur-lg border-t border-outline-variant/20 bg-surface/80 flex justify-around items-center h-20 px-4 pb-safe">
<button class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant/60 p-3 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="bookmark">bookmark</span>
</button>
<!-- ACTIVE TAB: Profile -->
<button class="flex items-center justify-center bg-primary/10 text-primary rounded-xl p-3 shadow-[0_0_15px_rgba(0,219,233,0.2)] active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="account_circle" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</button>
</nav>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('scale-95');
            });
        });

        // Subtle parallax or glow movement could be added here
    </script>
</body></html>
